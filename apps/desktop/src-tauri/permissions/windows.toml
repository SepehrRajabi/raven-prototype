# Raven's own commands each secondary window may call. The main window's set
# ("main-window", every command in app_commands.rs) is generated by build.rs.
# Commands in MAIN_ONLY (app_commands.rs) must never appear here: src/ipc_scope.rs
# refuses them outside the main window anyway, and a unit test checks this file.

[[set]]
identifier = "voice-overlay-commands"
description = "The voice overlay: reads its settings, layout and snapshot, sizes and drags itself, sends card actions to the main window, and reads the hotkeys it shows in its titles."
permissions = [
  "allow-overlay-get-settings",
  "allow-overlay-get-layout",
  "allow-overlay-get-snapshot",
  "allow-overlay-set-content-size",
  "allow-overlay-drag",
  "allow-overlay-drag-release",
  "allow-overlay-action",
  "allow-media-hotkeys-get-settings",
  "allow-diagnostics-log-ui-error",
]

[[set]]
identifier = "picture-in-picture-commands"
description = "Picture-in-picture windows: read the video state and the loopback frame endpoint, keep their aspect, and raise the main window."
permissions = [
  "allow-video-get-state",
  "allow-video-get-stream-endpoint",
  "allow-window-lock-aspect",
  "allow-window-show-main",
  "allow-diagnostics-log-ui-error",
]

