[package]
name = "raven-desktop"
version = "0.1.10"
description = "Raven desktop client"
authors = ["Raven"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[package.metadata]

[lib]
name = "raven_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["studio-noise-suppression"]
# The "Studio" noise suppression mode: DeepFilterNet 3 through tract, with its model
# (about 8 MB) compiled in. Without it, choosing Studio runs Strong and says so. Turn it
# off (`--no-default-features`) on a platform where tract does not build.
studio-noise-suppression = ["dep:deep_filter", "dep:ndarray"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

# build.rs asks it where LiveKit put libwebrtc.a, to load all of it on macOS. Keep it at
# the version webrtc-sys itself builds with, so both name the same download.
[target.'cfg(target_os = "macos")'.build-dependencies]
webrtc-sys-build = "=0.3.18"

[dependencies]
# macos-private-api: transparent windows (the voice overlay) on macOS. No effect elsewhere.
tauri = { version = "2.5.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2.2.7"
tauri-plugin-updater = "=2.10.1"
# The save picker for chat images.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
cpal = "0.15"
base64 = "0.22"
png = "0.17"
mozjpeg = "0.10.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
img-parts = "0.4"
fast_image_resize = "5"
thumbhash = "0.1"
livekit = { version = "0.7", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "macros", "net", "time", "io-util"] }
# The Workshop's port sharing talks to the server's relay over QUIC. Same versions livekit already
# builds; roots are the webpki ones, so the relay needs a publicly trusted certificate.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
webpki-roots = "1"
ringbuf = "0.4"
futures-util = { version = "0.3", features = ["io", "sink"] }
# Port sharing's WebSocket route (plan 02): yamux streams over one WebSocket with TLS.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
yamux = "0.13"
tokio-util = { version = "0.7", features = ["compat"] }
sonora = "0.1"
# The voice detector inside sonora's gain control, used on its own to tell speech from
# keyboards. Same versions sonora already depends on.
sonora-agc2 = "0.1"
sonora-simd = "0.1"
# RNNoise in pure Rust: the "Strong" noise suppression mode.
nnnoiseless = { version = "0.5", default-features = false }
# DeepFilterNet 3: the "Studio" mode. Vendored and trimmed to the inference path; see
# vendor/deep_filter/README.md. ndarray is the version its API takes.
deep_filter = { path = "vendor/deep_filter", optional = true }
ndarray = { version = "0.15", optional = true }
# Native camera capture (MSMF on Windows, AVFoundation on macOS, V4L2 on Linux).
nokhwa = { version = "0.10", features = ["input-native"] }

# Global media hotkeys. The backend registers system hotkeys on Windows and grabs keys
# through X11 on Linux (a Wayland session cannot grant global key grabs to apps).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
# The tray's one-time "still running" notice, and one Raven per desktop session.
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_Xps",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "implement",
] }
windows-core = "0.58"
# The main window's WebView2, to notice when its renderer dies (see diagnostics.rs). The
# same versions tauri's WebView2 backend already builds.
webview2-com = "0.38"
windows-core-webview2 = { package = "windows-core", version = "0.61" }
# Windows.Graphics.Capture (WGC) wrapper for monitor + window screen capture.
windows-capture = "1.4"

[target.'cfg(target_os = "linux")'.dependencies]
# xdg-desktop-portal ScreenCast client. The capture pipeline consumes the returned
# PipeWire node through the system GStreamer PipeWire plugin.
ashpd = "0.12.3"
libc = "0.2"
# Push to talk reads key and mouse state. Loaded at runtime, as global-hotkey already does.
x11-dl = "2.21"

[target.'cfg(target_os = "macos")'.dependencies]
# Native macOS display/window and system/app audio capture via ScreenCaptureKit.
screencapturekit = { version = "8.0.0", features = ["macos_13_0"] }

# Keep target/ small: line tables only for our crate, no debuginfo for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Studio's model is far too slow unoptimised: in a dev build it would never keep up and
# would always fall back to Strong. Optimise the inference path even there. tract also
# runs graph checks under debug assertions that reject DeepFilterNet's model ("duplicate
# name /convt3/Conv.bias"); release builds never run them, so dev builds don't either.
[profile.dev.package.deep_filter]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-onnx-opl]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-nnef]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-pulse]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-pulse-opl]
opt-level = 3
debug-assertions = false
[profile.dev.package.ndarray]
opt-level = 3
debug-assertions = false
[profile.dev.package.rustfft]
opt-level = 3
debug-assertions = false
[profile.dev.package.realfft]
opt-level = 3
debug-assertions = false
