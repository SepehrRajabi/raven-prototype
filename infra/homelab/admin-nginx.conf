# Serves the admin dashboard's static files (apps/admin). It decides nothing: signing in
# and every permission check happen in the API, which the edge proxies on the same host.
#
# The image runs nginx as an unprivileged user, so it listens on 8080 rather than 80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        include /etc/nginx/admin-security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built files carry a hash in their name, so they never change.
    location /assets/ {
        include /etc/nginx/admin-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The page itself is always fetched fresh, so a deploy is picked up at the next load.
    location / {
        include /etc/nginx/admin-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
