# Security headers for every response of the admin dashboard. nginx drops server-level
# add_header lines in any location that sets its own, so each location includes this file
# instead of relying on inheritance.
#
# The dashboard shows accounts and can change them. Nothing may frame it, it loads nothing
# from anywhere but itself (blob: is for the GIF and sticker previews it fetches with the
# session header), and it asks for no device or sensor.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), browsing-topics=()" always;
