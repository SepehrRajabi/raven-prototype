# Raven's edge on its own host. TLS ends at the ArvanCloud CDN, which reaches this
# server by plain HTTP on port 80, so the blocks read X-Forwarded-Proto instead of
# $scheme. Port 80 is open only to the CDN's ranges (firewall/raven-firewall-apply).
# The server blocks below are copied from the Vala edge.
resolver 127.0.0.11 valid=10s ipv6=off;

# The client's address. Every connection on port 80 comes from an ArvanCloud PoP, which
# adds the address it saw to X-Forwarded-For. nginx walks that header from the right and
# stops at the first address that is not a PoP, so $remote_addr below is the client and
# whatever a client wrote into the header itself is ignored. The API is then sent only
# that one address (X-Forwarded-For $remote_addr), because it trusts the leftmost entry.
#
# These are ArvanCloud's published ranges (https://www.arvancloud.ir/en/ips.txt, fetched
# 2026-11-14), the list firewall/raven-firewall-refresh keeps for the firewall. When that
# list changes, update these lines too: a missing range only makes clients behind that PoP
# share the PoP's address, it never lets a client choose its own.
set_real_ip_from 185.143.232.0/22;
set_real_ip_from 188.229.116.16/30;
set_real_ip_from 94.101.182.0/27;
set_real_ip_from 2.144.3.128/28;
set_real_ip_from 37.32.16.0/27;
set_real_ip_from 37.32.17.0/27;
set_real_ip_from 37.32.18.0/27;
set_real_ip_from 37.32.19.0/27;
set_real_ip_from 185.215.232.0/22;
set_real_ip_from 178.131.120.48/28;
set_real_ip_from 94.101.183.0/28;
set_real_ip_from 78.157.36.112/28;
set_real_ip_from 95.38.61.80/28;
set_real_ip_from 193.24.119.0/29;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Origin TLS (off). To encrypt the hop from the CDN to this host:
#   1. Put an origin certificate and key for the four names below in /srv/raven/tls/
#      (an ArvanCloud origin certificate, or any certificate the CDN accepts).
#   2. Uncomment the two ssl_ lines here and the "listen 443 ssl;" line in each server.
#   3. In compose.yaml, publish "443:443/tcp" on edge and mount /srv/raven/tls (see the
#      comments there). The firewall already lets the CDN reach 443.
#   4. In the ArvanCloud panel, set the origin protocol for these names to HTTPS.
#   5. Once traffic arrives on 443, remove "listen 80;" from the four named servers.
# ssl_certificate     /etc/nginx/tls/origin.crt;
# ssl_certificate_key /etc/nginx/tls/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;

server {
    listen 80 default_server;
    # listen 443 ssl default_server;
    server_name _;

    location = /edge-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# Raven services migrated from Saye.
server {
    listen 80;
    # listen 443 ssl;
    server_name mimir.rvn.bluehour.cloud;

    # Full chat image variants are capped at 10 MiB by the API.
    client_max_body_size 12m;

    access_log /var/log/nginx/access.log combined;

    # Clients reach this name only over HTTPS at the CDN, so HSTS is safe to send here.
    # The API sets nosniff on some responses; it is replaced, not doubled.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $raven_api raven-api:6977;

    # The admin API is reachable only through the dashboard's host (below), which has its
    # own password in front of it. Here it does not exist, whatever the letter case.
    location ~* ^/v1/admin(/|$) {
        return 404;
    }

    # Live update stream (server-sent events). It must reach the client as it is written:
    # buffering would hold presence and room changes back until a buffer filled. The API
    # sends a keepalive comment every 15 s, well inside the read timeout.
    location = /v1/nest-events {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Port sharing's relay, WebSocket route. One WebSocket lives as long as a share, up to
    # 12 h; yamux pings every 20 s, so a dead client is noticed long before the timeout.
    location = /v1/relay/ws {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }

    # A GIF or video can start as up to 20 MiB before the API converts it. Only this
    # upload route takes that much.
    location ~ ^/v1/library/assets/[^/]+/original$ {
        client_max_body_size 21m;
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Raven desktop releases (see docs/releasing.md).
server {
    listen 80;
    # listen 443 ssl;
    server_name updates.rvn.bluehour.cloud;

    access_log /var/log/nginx/access.log combined;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $raven_releases raven-releases:80;

    location / {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$raven_releases;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}

# Raven admin dashboard (apps/admin, see docs/permissions.md).
#
# Two locks: this host asks for a password before anything is served, and the dashboard
# then needs a Raven administrator to sign in. Only the parts of the API the dashboard
# uses are passed through; everything else answers 404.
server {
    listen 80;
    # listen 443 ssl;
    server_name admin.rvn.bluehour.cloud;

    # The dashboard sets its own Content-Security-Policy; these are replaced, not doubled.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    access_log /var/log/nginx/access.log combined;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $raven_api raven-api:6977;
    set $raven_admin raven-admin:8080;

    auth_basic "Raven admin";
    auth_basic_user_file /etc/nginx/raven-admin.htpasswd;

    location ~ ^/v1/(admin|auth|media)/ {
        # API answers are never cached. The dashboard's own files bring their caching
        # rules from the admin image (long-lived for hashed assets, none for the page).
        # An add_header here stops the server-level ones being inherited, so repeat them.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        # The edge password is for the edge. The API signs people in with its own header.
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
        client_max_body_size 12m;
    }

    location /v1/ {
        return 404;
    }

    location / {
        proxy_pass http://$raven_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
    }
}

server {
    listen 80;
    # listen 443 ssl;
    server_name rtc.rvn.bluehour.cloud;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $raven_livekit raven-livekit:7880;

    access_log /var/log/nginx/access.log combined;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass http://$raven_livekit;
    }
}
