# Raven's edge on its own host. TLS ends at the ArvanCloud CDN, which reaches this
# server by plain HTTP on port 80, so the blocks read X-Forwarded-Proto instead of
# $scheme. Port 80 is open only to the CDN's ranges (firewall/raven-firewall-apply).
# The server blocks below are copied unchanged from the Vala edge.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    location = /edge-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# Raven services migrated from Saye.
server {
    listen 80;
    server_name mimir.rvn.bluehour.cloud;

    # Full chat image variants are capped at 10 MiB by the API.
    client_max_body_size 12m;

    access_log /var/log/nginx/access.log combined;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $raven_api raven-api:6977;

    # Live update stream (server-sent events). It must reach the client as it is written:
    # buffering would hold presence and room changes back until a buffer filled. The API
    # sends a keepalive comment every 15 s, well inside the read timeout.
    location = /v1/nest-events {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Port sharing's relay, WebSocket route (docs/plans/workshop/02-wss-fallback.md). One
    # WebSocket lives as long as a share, up to 12 h; yamux pings every 20 s, so a dead
    # client is noticed long before the timeout.
    location = /v1/relay/ws {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }

    # The admin API is reachable only through the dashboard's host (raven.conf), which
    # has its own password in front of it. Here it does not exist.
    location /v1/admin/ {
        return 404;
    }

    # A GIF or video can start as up to 20 MiB before the API converts it
    # (docs/plans/gifs-stickers). Only this upload route takes that much.
    location ~ ^/v1/library/assets/[^/]+/original$ {
        client_max_body_size 21m;
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Raven desktop releases (see docs/releasing.md).
server {
    listen 80;
    server_name updates.rvn.bluehour.cloud;

    access_log /var/log/nginx/access.log combined;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $raven_releases raven-releases:80;

    location / {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$raven_releases;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}

# Raven admin dashboard (apps/admin, see docs/permissions.md).
#
# Two locks: this host asks for a password before anything is served, and the dashboard
# then needs a Raven administrator to sign in. Only the parts of the API the dashboard
# uses are passed through; everything else answers 404.
server {
    listen 80;
    server_name admin.rvn.bluehour.cloud;

    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/access.log combined;

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $raven_api raven-api:6977;
    set $raven_admin raven-admin:80;

    auth_basic "Raven admin";
    auth_basic_user_file /etc/nginx/raven-admin.htpasswd;

    location ~ ^/v1/(admin|auth|media)/ {
        proxy_pass http://$raven_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        # The edge password is for the edge. The API signs people in with its own header.
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
        client_max_body_size 12m;
    }

    location /v1/ {
        return 404;
    }

    location / {
        proxy_pass http://$raven_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name rtc.rvn.bluehour.cloud;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $raven_livekit raven-livekit:7880;

    access_log /var/log/nginx/access.log combined;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass http://$raven_livekit;
    }
}

