# Example nginx config for a Raven server, one vhost per name (see docs/self-hosting.md).
# Replace the three example.org names, then run certbot --nginx for each.
# The containers listen on 127.0.0.1 only, so this proxy must run on the same machine.
#
# This proxy is the first hop people connect to, so it sends the API the address it saw
# (X-Forwarded-For $remote_addr) and drops whatever a client put in that header. The API
# believes the leftmost address, so passing the client's own header on would let anyone
# choose the address that sign-in throttling and the sessions list see.
#
# Behind a CDN or another proxy, add its published ranges in each server block instead:
#   set_real_ip_from <range>;   (one line per range)
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
# $remote_addr is then the client, and the lines below stay as they are.
#
# Strict-Transport-Security only takes effect over HTTPS, so it is harmless before
# certbot has run and tells browsers to keep to HTTPS after.

server {
    listen 80;
    # Run certbot --nginx to add the TLS lines and the redirect.
    server_name raven.example.org;

    # Full chat image variants are capped at 10 MiB by the API.
    client_max_body_size 12m;

    # The API's own nosniff is replaced, not doubled.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # The admin API is reachable only through the dashboard's host (the third server
    # block), which has its own password in front of it. Here it does not exist, whatever
    # the letter case.
    location ~* ^/v1/admin(/|$) {
        return 404;
    }

    # Live update stream (server-sent events). It must reach the client as it is written:
    # buffering would hold presence and room changes back until a buffer filled. The API
    # sends a keepalive comment every 15 s, well inside the read timeout.
    location = /v1/nest-events {
        proxy_pass http://127.0.0.1:6977;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:6977;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    # Run certbot --nginx to add the TLS lines and the redirect.
    server_name rtc.example.org;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass http://127.0.0.1:7880;
    }
}

# Raven admin dashboard (apps/admin).
#
# Two locks: this host asks for a password before anything is served, and the dashboard
# then needs a Raven administrator to sign in. Only the parts of the API the dashboard
# uses are passed through; everything else answers 404.
server {
    listen 80;
    # Run certbot --nginx to add the TLS lines and the redirect.
    server_name admin.example.org;

    # The dashboard sets its own Content-Security-Policy; these are replaced, not doubled.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    auth_basic "Raven admin";
    # Create it with: htpasswd -c /etc/nginx/raven.htpasswd <name>
    auth_basic_user_file /etc/nginx/raven.htpasswd;

    location ~ ^/v1/(admin|auth|media)/ {
        # API answers are never cached. The dashboard's own files bring their caching
        # rules from the admin image (long-lived for hashed assets, none for the page).
        # An add_header here stops the server-level ones being inherited, so repeat them.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        proxy_pass http://127.0.0.1:6977;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        # The edge password is for the edge. The API signs people in with its own header.
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
        client_max_body_size 12m;
    }

    location /v1/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
    }
}
