# The desktop app for macOS, one build per processor, each on a runner of that kind:
#
#   Raven_X.Y.Z_aarch64.dmg   Apple silicon (M1 and later)   built on macos-26
#   Raven_X.Y.Z_x64.dmg       Intel                          built on macos-26-intel
#
# Both run on macOS 13 and later (bundle.macOS.minimumSystemVersion); the runners only
# need to be new enough to build them: screencapturekit's Metal bridge (apple-metal)
# needs the macOS 26 SDK, which macOS 15 images do not have by default. Each build is then
# checked: the binary is for the right processor and macOS version, its signature holds,
# and it loads nothing from outside macOS and the app itself.
#
# The builds are signed ad hoc, not with a Developer ID, and are not notarized, so
# Gatekeeper asks before the first launch (see docs/releasing.md). They are attached to a
# GitHub release only when asked: run this workflow by hand on the release tag with
# "attach to release" ticked.
name: macOS builds

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - ".github/workflows/macos-builds.yml"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/package.json"
      - "apps/desktop/bun.lock"
  pull_request:
    paths:
      - ".github/workflows/macos-builds.yml"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/package.json"
      - "apps/desktop/bun.lock"
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Attach the builds to the GitHub release of this tag (run on a v* tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-builds-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The server a fresh install signs in to, as in release.ps1.
  VITE_RAVEN_API_URL: ${{ vars.RAVEN_API_URL || 'https://mimir.rvn.bluehour.cloud' }}
  # Ad hoc: every part of the bundle signed consistently, with no identity behind it.
  APPLE_SIGNING_IDENTITY: "-"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apple-silicon
            runner: macos-26
            target: aarch64-apple-darwin
            arch: arm64
          - name: intel
            runner: macos-26-intel
            target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      # mozjpeg assembles its x86 SIMD code with NASM.
      - name: Install NASM
        if: matrix.arch == 'x86_64'
        run: brew install nasm
      # Downloaded crates and compiled dependencies, one cache per processor, keyed on
      # Cargo.lock and the compiler; Raven's own crate is always rebuilt. Pull requests
      # read the cache but don't save to it, so they can't push out the main branch's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build
        working-directory: apps/desktop
        run: |
          bun install --frozen-lockfile
          bun run tauri build --target ${{ matrix.target }} --bundles app,dmg
      - name: Check the app
        working-directory: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          set -euo pipefail
          app=macos/Raven.app
          binary="$app/Contents/MacOS/raven-desktop"

          archs=$(lipo -archs "$binary")
          echo "Architectures: $archs"
          if [ "$archs" != "${{ matrix.arch }}" ]; then
            echo "Expected only ${{ matrix.arch }}." >&2
            exit 1
          fi

          minos=$(vtool -show-build "$binary" | awk '$1 == "minos" { print $2; exit }')
          echo "Minimum macOS: $minos"
          if [ "$(printf '%s\n' "$minos" 13.0 | sort -V | tail -n 1)" != 13.0 ]; then
            echo "The binary needs a newer macOS than 13.0, the oldest this app supports." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"

          # Everything the binary loads must come with macOS or with the app.
          missing=0
          for library in $(otool -L "$binary" | tail -n +2 | awk '{ print $1 }'); do
            case "$library" in
              /System/Library/* | /usr/lib/*) ;;
              @rpath/* | @executable_path/* | @loader_path/*)
                name=${library#*/}
                if [ ! -e "$app/Contents/Frameworks/$name" ]; then
                  echo "Not in the app: $library" >&2
                  missing=1
                fi
                ;;
              *)
                echo "Outside macOS and the app: $library" >&2
                missing=1
                ;;
            esac
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All $(otool -L "$binary" | tail -n +2 | wc -l | tr -d ' ') linked libraries are part of macOS or the app."

          dmg=$(ls dmg/*.dmg)
          hdiutil verify "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  attach:
    name: Attach to the GitHub release
    if: github.event_name == 'workflow_dispatch' && inputs.attach_to_release && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: builds
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd builds
          sha256sum -- * > SHA256SUMS-macos
          # release.ps1 creates the release with its notes; this only adds files to it.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*
